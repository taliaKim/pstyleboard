<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리반 게시판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
  :root{
    --primary:#8b9cf7;
    --primary-dark:#6c7ee8;
    --pink:#f7b8d4;
    --bg:#f6f7ff;
    --card:#ffffff;
    --text:#3a3a4a;
    --muted:#8a8aa0;
    --border:#e6e8fb;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;
  }
  .hidden{display:none !important;}
  .screen{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- 공통 ---- */
  .center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{
    background:var(--card);border-radius:24px;padding:36px 32px;width:100%;max-width:420px;
    box-shadow:0 10px 30px rgba(100,100,180,0.12);
  }
  .auth-card h1{text-align:center;font-size:26px;margin:0 0 6px;color:var(--primary-dark);}
  .auth-sub{text-align:center;color:var(--muted);margin-bottom:24px;font-size:14px;}
  .tabs{display:flex;background:#eef0ff;border-radius:12px;padding:4px;margin-bottom:20px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:10px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px;}
  .tab-btn.active{background:var(--primary);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;
    outline:none;transition:.15s;
  }
  .field input:focus{border-color:var(--primary);}
  .row2{display:flex;gap:10px;}
  .row2 .field{flex:1;}
  .pw-wrap{position:relative;}
  .pw-wrap input{padding-right:42px;}
  .eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:18px;color:var(--muted);}
  .btn{
    width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;
    font-size:15px;font-weight:700;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:#eef0ff;color:var(--primary-dark);}
  .btn.pink{background:var(--pink);color:#7a3355;}
  .btn.danger{background:#fdeaf1;color:#c14b74;}
  .btn.danger:hover{background:#f8c9db;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:9px;}
  .err-msg{color:#e0507a;font-size:13px;margin-top:8px;text-align:center;min-height:16px;}

  /* ---- 상단 헤더 ---- */
  header.topbar{
    background:var(--card);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 2px 8px rgba(100,100,180,0.06);position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:10px;
  }
  .user-info{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--primary-dark);flex-wrap:wrap;}
  .user-info .badge{background:#eef0ff;padding:5px 12px;border-radius:20px;font-size:13px;color:var(--primary-dark);}
  .topbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .logout-btn{background:#fdeaf1;color:#c14b74;border:none;padding:9px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;}

  /* ---- 교사 대시보드 ---- */
  .dash-wrap{max-width:900px;margin:0 auto;padding:24px 16px;width:100%;flex:1;}
  .panel{background:var(--card);border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(100,100,180,0.08);margin-bottom:20px;}
  .panel h2{margin-top:0;font-size:18px;color:var(--primary-dark);}
  .board-list{display:flex;flex-direction:column;gap:10px;}
  .board-item{
    display:flex;justify-content:space-between;align-items:center;padding:14px 16px;
    border:1.5px solid var(--border);border-radius:12px;gap:10px;flex-wrap:wrap;
  }
  .board-item .binfo{font-weight:700;color:var(--text);}
  .board-item .bmeta{font-size:12px;color:var(--muted);margin-top:3px;}
  .board-item .bactions{display:flex;gap:6px;flex-wrap:wrap;}

  /* ---- 게시판 화면 ---- */
  #screen-board{height:100vh;overflow:hidden;}
  .board-screen-wrap{flex:1;display:flex;flex-direction:column;padding:16px;max-width:1600px;margin:0 auto;width:100%;min-height:0;overflow:hidden;}
  .board-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px;flex-shrink:0;}
  .board-title-row h2{margin:0;color:var(--primary-dark);}
  .board-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .slots-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));grid-auto-rows:minmax(380px,1fr);gap:14px;
    flex:1;min-height:0;overflow-y:auto;padding-bottom:70px;align-content:start;
  }
  .slot-card{
    background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(100,100,180,0.08);
    display:flex;flex-direction:column;min-height:320px;overflow:hidden;
  }
  .slot-head{font-weight:800;color:var(--primary-dark);font-size:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
  .slot-head .num{background:var(--primary);color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;margin-right:6px;}
  .kick-btn{background:#fdeaf1;color:#c14b74;border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1;}
  .edit-name-btn{background:none;border:none;cursor:pointer;font-size:12px;margin-left:4px;padding:0;vertical-align:middle;}
  .add-post-btn{
    margin-top:8px;flex-shrink:0;width:100%;padding:8px;border:1.5px dashed var(--border);border-radius:10px;
    background:#f8f9ff;color:var(--primary-dark);font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .add-post-btn:hover{background:#eef0ff;}
  .kick-btn:hover{background:#f8c9db;}
  .slot-posts{flex:1;overflow-y:auto;min-height:0;}
  .post-item{background:#faf9ff;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:16px;line-height:1.5;position:relative;overflow-wrap:break-word;word-break:break-word;}
  .post-link{color:var(--primary-dark);text-decoration:underline;overflow-wrap:break-word;word-break:break-all;}
  .yt-embed{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-top:8px;border-radius:8px;background:#000;}
  .yt-embed iframe{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:8px;border:none;}
  .post-item img{max-width:100%;border-radius:8px;margin-top:6px;display:block;}
  .post-item a.file-link{display:inline-block;margin-top:6px;color:var(--primary-dark);font-weight:600;font-size:13px;}
  .post-time{color:var(--muted);font-size:12px;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .color-btn{background:none;border:none;cursor:pointer;flex-shrink:0;padding:0;font-size:14px;line-height:1;}
  .del-btn{background:none;border:none;cursor:pointer;flex-shrink:0;padding:0;font-size:14px;line-height:1;}
  .color-palette{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .color-swatch{width:20px;height:20px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--border);cursor:pointer;padding:0;}
  .empty-slot{color:var(--muted);font-size:13px;text-align:center;margin-top:20px;}

  /* ---- 플로팅 새 글쓰기 버튼 & 모달 ---- */
  .fab{
    position:fixed;bottom:26px;right:26px;background:var(--primary);color:#fff;border:none;
    width:60px;height:60px;border-radius:50%;font-size:28px;box-shadow:0 8px 20px rgba(108,126,232,0.4);
    cursor:pointer;z-index:30;
  }
  .modal-overlay{
    position:fixed;inset:0;background:rgba(50,50,80,0.35);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;
  }
  .modal-box{
    background:#fff;border-radius:20px;padding:24px;width:100%;max-width:440px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
  }
  .modal-box h3{margin-top:0;color:var(--primary-dark);}
  .modal-box textarea{
    width:100%;min-height:110px;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-size:14px;
    font-family:inherit;resize:vertical;outline:none;
  }
  .modal-box textarea:focus{border-color:var(--primary);}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .file-drop{border:1.5px dashed var(--border);border-radius:10px;padding:10px;text-align:center;font-size:13px;color:var(--muted);margin-top:10px;cursor:pointer;flex:1;}
  .file-drop-row{display:flex;align-items:center;gap:8px;}
  .file-clear-btn{background:#fdeaf1;color:#c14b74;border:none;border-radius:50%;width:26px;height:26px;font-size:13px;cursor:pointer;flex-shrink:0;margin-top:10px;}
  .toast{
    position:fixed;bottom:100px;right:26px;background:#3a3a4a;color:#fff;padding:10px 16px;border-radius:10px;
    font-size:13px;z-index:60;opacity:0;transform:translateY(8px);transition:.2s;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  @media (max-width:640px){
    .slots-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
    .auth-card{padding:26px 20px;}
  }
</style>
</head>

<script>
/* ===================== 초기화 ===================== */
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
let currentUser = null;   // {role, grade, cls, number, name}
let currentBoard = null;  // {id, name, link_code, total_slots}
let realtimeChannel = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ===================== 로그인 화면 탭 ===================== */
function switchTab(which){
  document.getElementById('tab-student').classList.toggle('active', which==='student');
  document.getElementById('tab-teacher').classList.toggle('active', which==='teacher');
  document.getElementById('student-form').classList.toggle('hidden', which!=='student');
  document.getElementById('teacher-form').classList.toggle('hidden', which!=='teacher');
}
function togglePw(){
  const pw = document.getElementById('t-pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
}

/* URL 파라미터로 들어온 게시판 코드 자동 반영 */
const urlParams = new URLSearchParams(location.search);
const urlBoardCode = urlParams.get('b');
if(urlBoardCode){
  document.getElementById('s-boardcode').value = urlBoardCode;
  document.getElementById('s-boardcode-field').classList.add('hidden');
  document.getElementById('board-link-hint').textContent = '게시판 링크로 접속했어요. 정보를 입력하고 입장하세요.';
} else {
  const savedCode = localStorage.getItem('cb_remembered_code');
  if(savedCode){
    document.getElementById('s-boardcode').value = savedCode;
    document.getElementById('remember-code').checked = true;
  }
}

/* ===================== 로그인 처리 ===================== */
async function teacherLogin(){
  const id = document.getElementById('t-id').value.trim();
  const pw = document.getElementById('t-pw').value;
  const errEl = document.getElementById('teacher-err');
  if(id === CONFIG.TEACHER_ID && pw === CONFIG.TEACHER_PW){
    currentUser = { role:'teacher', name:'선생님' };
    sessionStorage.setItem('cb_user', JSON.stringify(currentUser));
    errEl.textContent='';
    enterDashboard();
  } else {
    errEl.textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  }
}

async function studentLogin(){
  const grade = document.getElementById('s-grade').value.trim();
  const cls = document.getElementById('s-class').value.trim();
  const number = document.getElementById('s-number').value.trim();
  const name = document.getElementById('s-name').value.trim();
  const boardCode = document.getElementById('s-boardcode').value.trim();
  const errEl = document.getElementById('student-err');

  if(!grade||!cls||!number||!name){ errEl.textContent='모든 항목을 입력해주세요.'; return; }
  if(!boardCode){ errEl.textContent='게시판 코드(링크)를 입력해주세요.'; return; }

  errEl.textContent = '확인 중...';

  // 게시판/슬롯 조회 후 이미 다른 이름으로 로그인된 번호인지 확인
  const { data: board, error: boardErr } = await sb.from('boards').select('*').eq('link_code', boardCode).single();
  if(boardErr || !board){ errEl.textContent = '게시판을 찾을 수 없습니다. 코드를 확인해주세요.'; return; }

  const { data: slot, error: slotErr } = await sb.from('board_slots').select('*')
    .eq('board_id', board.id).eq('slot_number', parseInt(number)).maybeSingle();
  if(slotErr || !slot){ errEl.textContent = '해당 번호의 게시물 칸이 없습니다. 번호를 확인해주세요.'; return; }

  if(slot.student_name && slot.student_name.trim() !== name){
    errEl.textContent = `이미 "${slot.student_name}" 님이 ${number}번으로 로그인되어 있습니다. 번호를 다시 확인해주세요.`;
    return;
  }

  currentUser = { role:'student', grade, cls, number:parseInt(number), name };
  sessionStorage.setItem('cb_user', JSON.stringify(currentUser));
  errEl.textContent = '';

  if(document.getElementById('remember-code').checked){
    localStorage.setItem('cb_remembered_code', boardCode);
  } else {
    localStorage.removeItem('cb_remembered_code');
  }

  await enterBoardByCode(boardCode, true);
}

async function logout(){
  if(currentUser && currentUser.role==='student' && currentBoard){
    try{
      await sb.from('board_slots').update({ student_name: null })

const POST_COLORS = ['#faf9ff','#fff4d6','#ffe3e3','#e3f6ff','#e5ffe8','#f3e3ff','#ffe8f3','#e8f0ff','#fff0e0','#e0fff5','#f0e8ff','#ffe0ec','#eaffea','#fff9c4'];

function linkifyContent(escapedText){
  const urlRegex = /(https?:\/\/[^\s<]+)/g;
  return escapedText.replace(urlRegex, url => {
    // 문장부호가 URL 끝에 딸려오는 경우 분리
    const trailingMatch = url.match(/[).,!?;:]+$/);
    const trailing = trailingMatch ? trailingMatch[0] : '';
    const cleanUrl = trailing ? url.slice(0, -trailing.length) : url;
    return `<a class="post-link" href="${cleanUrl}" target="_blank" rel="noopener noreferrer">${cleanUrl}</a>${trailing}`;
  });
}

function extractYoutubeId(text){
  if(!text) return null;
  const match = text.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return match ? match[1] : null;
}

function renderPostItem(p, canDelete){
  const time = new Date(p.created_at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  let fileHtml = '';
  if(p.file_url){
    if(p.file_type && p.file_type.startsWith('image/')){
      fileHtml = `<img src="${p.file_url}" alt="첨부이미지"><a class="file-link" href="${p.file_url}" target="_blank" download>⬇ 이미지 다운로드</a>`;
    } else {
      fileHtml = `<a class="file-link" href="${p.file_url}" target="_blank" download>📎 ${escapeHtml(p.file_name||'첨부파일')}</a>`;
    }
  }
  const ytId = extractYoutubeId(p.content);
  const ytHtml = ytId ? `<div class="yt-embed"><iframe src="https://www.youtube.com/embed/${ytId}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>` : '';
  const contentHtml = p.content ? linkifyContent(escapeHtml(p.content)).replace(/\n/g,'<br>') : '';
  const bg = p.color || '#faf9ff';
  const deleteBtn = canDelete
    ? `<button class="del-btn" title="삭제" onclick="deletePost('${p.id}','${p.file_url ? p.file_url.split('/post-files/')[1] : ''}')">🗑</button>`
    : '';
  return `<div class="post-item" style="background:${bg}">
    ${contentHtml ? `<div>${contentHtml}</div>` : ''}
    ${ytHtml}
    ${fileHtml}
    <div class="post-time">
      <span>${time}</span>
      <span style="display:flex;gap:6px;">
        <button class="color-btn" title="색상 변경" onclick="togglePalette('${p.id}')">🎨</button>
        ${deleteBtn}
      </span>
    </div>
    <div class="color-palette hidden" id="palette-${p.id}">
      ${POST_COLORS.map(c=>`<button class="color-swatch" style="background:${c}" onclick="setPostColor('${p.id}','${c}')"></button>`).join('')}
    </div>
  </div>`;
}

const MAX_IMAGE_BYTES = 500 * 1024; // 500KB

// 가로/세로 크기는 그대로 두고 화질(압축률)만 낮춰서 용량을 줄임
async function compressImageIfNeeded(file){
  if(!file.type || !file.type.startsWith('image/')) return file;
  if(file.type === 'image/gif') return file; // 움직이는 gif는 압축 시 애니메이션이 깨져서 제외
  if(file.size <= MAX_IMAGE_BYTES) return file;

  try{
    const imgUrl = URL.createObjectURL(file);
    const img = await new Promise((resolve, reject)=>{
      const im = new Image();
      im.onload = ()=>resolve(im);
      im.onerror = reject;
      im.src = imgUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(imgUrl);

    let quality = 0.9;
    let blob = await new Promise(res=>canvas.toBlob(res, 'image/jpeg', quality));
    while(blob && blob.size > MAX_IMAGE_BYTES && quality > 0.15){
      quality -= 0.1;
      blob = await new Promise(res=>canvas.toBlob(res, 'image/jpeg', quality));
    }
    if(!blob) return file; // 압축 실패 시 원본 사용

    const newName = file.name.replace(/\.[a-zA-Z0-9]+$/, '') + '.jpg';
    return new File([blob], newName, { type:'image/jpeg' });
  }catch(e){
    return file; // 압축 중 오류 시 원본 그대로 업로드
  }
}

async function submitPost(){
  const content = document.getElementById('write-content').value.trim();
  let file = document.getElementById('write-file').files[0];
  const errEl = document.getElementById('write-err');
  if(!content && !file){ errEl.textContent='내용이나 파일을 입력해주세요.'; return; }

  const slotNumber = writeTargetSlot !== null ? writeTargetSlot : (currentUser.role==='teacher' ? 0 : currentUser.number);
  const studentName = writeTargetSlot !== null
    ? (writeTargetName || (slotNumber===0 ? '선생님' : null))
    : (currentUser.role==='teacher' ? '선생님' : currentUser.name);

  let file_url=null, file_name=null, file_type=null;
  if(file){
    if(file.type && file.type.startsWith('image/') && file.size > MAX_IMAGE_BYTES){
      errEl.textContent='이미지 용량 줄이는 중...';
      file = await compressImageIfNeeded(file);
    }
    errEl.textContent='업로드 중...';
    // 파일명에 한글/공백/특수문자가 있으면 스토리지 경로 오류가 날 수 있어 안전한 이름으로 저장 (원래 이름은 file_name에 별도 보관)
    const extMatch = file.name.match(/\.[a-zA-Z0-9]+$/);
    const ext = extMatch ? extMatch[0] : '';
    const safePath = `${currentBoard.id}/${Date.now()}_${Math.random().toString(36).slice(2,8)}${ext}`;
    const { error: upErr } = await sb.storage.from('post-files').upload(safePath, file, {
      contentType: file.type || undefined
    });
    if(upErr){ errEl.textContent='파일 업로드 실패: '+upErr.message; return; }
    const { data: pub } = sb.storage.from('post-files').getPublicUrl(safePath);
    file_url = pub.publicUrl; file_name = file.name; file_type = file.type;
  }

  const { error } = await sb.from('posts').insert({
    board_id: currentBoard.id, slot_number: slotNumber, student_name: studentName,
    content, file_url, file_name, file_type
  });
  if(error){ errEl.textContent='게시 실패: '+error.message; return; }

  closeWriteModal();
  toast('게시되었습니다!');
  await loadBoardContent();
}

async function saveToComputer(){
  toast('압축 파일 준비 중...');
  const { data: posts, error } = await sb.from('posts').select('*').eq('board_id', currentBoard.id).order('slot_number');
  if(error){ toast('불러오기 실패: '+error.message); return; }

  const zip = new JSZip();
  const dateStr = new Date().toISOString().slice(0,10);

  for(const p of (posts||[])){
    const slotLabel = `${p.slot_number}_${p.student_name || '무기명'}`;
    const folder = zip.folder(slotLabel);

    if(p.content){
      folder.file(`글_${p.id}.txt`, p.content);
    }
    if(p.file_url){
      try{
        const resp = await fetch(p.file_url);
        const blob = await resp.blob();
        folder.file(p.file_name || `파일_${p.id}`, blob);
      }catch(e){
        folder.file(`파일다운로드실패_${p.id}.txt`, `파일 URL: ${p.file_url}\n오류: ${e}`);
      }
    }
  }

  try{
    const zipBlob = await zip.generateAsync({ type:'blob' });
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentBoard.name}_${dateStr}.zip`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('내 컴퓨터에 저장되었습니다!');
  }catch(e){
    toast('압축 파일 생성 실패: '+e);
  }
}

function openDriveFolder(){
  if(!CONFIG.DRIVE_FOLDER_ID){ toast('DRIVE_FOLDER_ID 설정이 필요합니다.'); return; }
  window.open(`https://drive.google.com/drive/folders/${CONFIG.DRIVE_FOLDER_ID}`, '_blank');
}

async function exportToDrive(){
  if(!CONFIG.GAS_EXPORT_URL || CONFIG.GAS_EXPORT_URL.includes('YOUR_DEPLOY_ID')){
    toast('GAS_EXPORT_URL 설정이 필요합니다.'); return;
  }
  toast('구글 드라이브로 내보내는 중...');
  const { data: posts } = await sb.from('posts').select('*').eq('board_id', currentBoard.id).order('slot_number');
  const payload = {
    boardName: currentBoard.name,
    posts: (posts||[]).map(p=>({
      slotNumber: p.slot_number, studentName: p.student_name, content: p.content,
      fileUrl: p.file_url, fileName: p.file_name, createdAt: p.created_at
    }))
  };
  try{
    // 구글 앱스 스크립트 웹앱은 CORS 응답 헤더를 제공하지 않아 응답을 읽을 수 없으므로
    // no-cors 모드로 요청만 보내고, 결과는 구글 드라이브에서 직접 확인해야 함
    await fetch(CONFIG.GAS_EXPORT_URL, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify(payload)
    });
    toast('내보내기 요청을 보냈습니다. 잠시 후 구글 드라이브 폴더를 확인해주세요.');
  }catch(e){ toast('내보내기 중 오류가 발생했습니다.'); }
}

/* ===================== 유틸 ===================== */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ===================== 세션 복원 ===================== */
(function restoreSession(){
  const savedUser = sessionStorage.getItem('cb_user');
  const savedBoard = sessionStorage.getItem('cb_board');
  if(savedUser){
    currentUser = JSON.parse(savedUser);
    if(currentUser.role==='teacher'){
      if(savedBoard){
        currentBoard = JSON.parse(savedBoard);
        renderUserBadge();
        document.getElementById('export-btn').classList.remove('hidden');
        document.getElementById('add-slot-btn').classList.remove('hidden');
        document.getElementById('drive-view-btn').classList.remove('hidden');
        document.getElementById('save-local-btn').classList.remove('hidden');
        document.getElementById('board-title').textContent = `📌 ${currentBoard.name}`;
        showScreen('screen-board');
        loadBoardContent(); subscribeRealtime();
      } else { enterDashboard(); }
    } else if(savedBoard){
      currentBoard = JSON.parse(savedBoard);
      renderUserBadge();
      document.getElementById('export-btn').classList.add('hidden');
      document.getElementById('add-slot-btn').classList.add('hidden');
      document.getElementById('drive-view-btn').classList.add('hidden');
      document.getElementById('save-local-btn').classList.add('hidden');
      document.getElementById('board-title').textContent = `📌 ${currentBoard.name}`;
      showScreen('screen-board');
      loadBoardContent(); subscribeRealtime();
    }
  }
})();
</script>
